name: Promote verified v35 source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-v35.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reassemble and verify v35
        shell: bash
        run: |
          set -euo pipefail
          cat release/v35/parts/index.html.part* > index.html.v35
          expected="fc46acdfb5af61e1a01b915fb0e88494151cc622d7dd06febc54d47a45134591"
          actual="$(sha256sum index.html.v35 | awk '{print $1}')"
          echo "Expected: $expected"
          echo "Actual:   $actual"
          test "$actual" = "$expected"
          mv index.html.v35 index.html

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Root index.html is already the verified v35 source."
            exit 0
          fi
          git commit -m "Promote verified v35 release source"
          git push
